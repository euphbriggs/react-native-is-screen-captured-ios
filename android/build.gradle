buildscript {
  if (project == rootProject) {
    repositories {
      maven { url 'https://jitpack.io' }
      google()
      mavenCentral()
    }

    dependencies {
      classpath('com.android.tools.build:gradle:9.0.0')
    }
  }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.reactnativeisscreencapturedios"

  compileSdkVersion safeExtGet('IsScreenCapturedIos_compileSdkVersion', 36)
  buildToolsVersion safeExtGet('IsScreenCapturedIos_buildToolsVersion', '36.0.0')
  defaultConfig {
    minSdkVersion safeExtGet('IsScreenCapturedIos_minSdkVersion', 28)
    targetSdkVersion safeExtGet('IsScreenCapturedIos_targetSdkVersion', 36)
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  maven { url 'https://jitpack.io' }
  mavenLocal()
  maven {
    // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
    url("$rootDir/../node_modules/react-native/android")
  }
  google()
  mavenCentral()
}

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"  // From node_modules
}
